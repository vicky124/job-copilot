[project]
name = "job-copilot"
version = "0.1.0"
description = "Job Application Copilot: resume parsing, job matching, tailoring with human approval, interview prep. LangGraph + RAG + MCP + Langfuse."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Victory", email = "vickyjadhav.ai@gmail.com" }]

# Core runtime: the domain, services and ports depend only on these two.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Infrastructure adapters. Each adapter imports its library lazily, so the
# core and the unit tests run without them.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
graph = ["langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0", "langchain-core>=0.3"]
llm = ["litellm>=1.50", "langchain-litellm>=0.1"]
rag = ["qdrant-client>=1.12", "fastembed>=0.4"]
http = ["httpx>=0.27"]
mcp = ["mcp>=1.2", "langchain-mcp-adapters>=0.1"]
observability = ["langfuse>=2.50", "opentelemetry-sdk>=1.27", "prometheus-client>=0.21"]
documents = ["python-docx>=1.1", "pypdf>=4.0", "weasyprint>=62"]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13", "redis>=5.0"]
all = ["job-copilot[api,graph,llm,rag,http,mcp,observability,documents,db]"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
copilot-api = "copilot.api.app:main"
copilot-validate-companies = "scripts.validate_companies:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot", "mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["copilot"]
omit = ["copilot/adapters/*/litellm_*", "copilot/adapters/*/qdrant*", "copilot/adapters/*/langfuse*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ₹, –, → in strings/comments

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
