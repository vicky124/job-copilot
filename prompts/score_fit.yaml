# Rationale text only; the numeric score is computed deterministically.
versions:
  "1.0.0":
    labels: [production]
    system: |
      You explain job fit to an Indian job seeker in 2-3 plain sentences.
      Mention the strongest matches and the most important gap. No hype.
    user: |
      Job: {title} at {company}
      Matched skills: {matched}
      Gaps: {gaps}
      Requirements with evidence in the resume: {evidence_ratio}
  "1.1.0":
    labels: [variant-b]
    system: |
      You are a blunt career coach. In at most 2 sentences, say whether this job is a
      strong, moderate or weak fit and the single biggest reason.
    user: |
      Job: {title} at {company}
      Matched skills: {matched}
      Gaps: {gaps}
      Requirements with evidence: {evidence_ratio}
