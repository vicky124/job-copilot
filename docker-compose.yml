# Local stack. All credentials come from .env (copy .env.example; values are dummies).
#   docker compose up -d qdrant postgres redis minio ollama
#   docker compose --profile observability up -d        # + Langfuse
#   docker compose --profile app up -d                  # + API and MCP servers

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dummy-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dummy-minio-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dummy-minio-secret-key-000000000}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  ollama:
    # Serves the local embedding model. After start: docker compose exec ollama ollama pull nomic-embed-text
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  langfuse:
    profiles: [observability]
    image: langfuse/langfuse:2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-dummy-db-password}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${AUTH_SECRET:-dummy-authjs-secret-change-me-00000000000000}
      SALT: dummy-langfuse-salt-change-me
    ports: ["3001:3000"]

  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_API_BASE: http://ollama:11434
    depends_on: [qdrant, postgres, redis, ollama]
    ports: ["8000:8000"]

  jobboard-mcp:
    profiles: [app]
    build: .
    command: python -m mcp_servers.jobboard.server
    env_file: .env
    environment: { MCP_TRANSPORT: streamable-http }
    ports: ["8101:8000"]

  docgen-mcp:
    profiles: [app]
    build: .
    command: python -m mcp_servers.docgen.server
    env_file: .env
    environment: { MCP_TRANSPORT: streamable-http }
    ports: ["8102:8000"]

  calendar-mcp:
    profiles: [app]
    build: .
    command: python -m mcp_servers.calendar.server
    env_file: .env
    environment: { MCP_TRANSPORT: streamable-http }
    ports: ["8103:8000"]

volumes:
  qdrant_data:
  pg_data:
  minio_data:
  ollama_data:
